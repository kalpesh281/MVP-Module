<!-- The Boundry mark. Kept in sync by hand with
     src/Components/Layout/Logo.jsx — same geometry, same idea: a
     perimeter of four corner brackets with the top-right one detached and
     sitting outside the line.

     Drawn on the filled tile rather than as a bare glyph, because a tab
     favicon renders at 16px against whatever chrome colour the browser
     and the OS theme happen to be using. A bare stroke disappears on a
     dark tab strip; a tile does not. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <rect width="24" height="24" rx="6" fill="#1a1815"/>
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(2.4 2.4) scale(0.8)">
    <g stroke="#e8e4dc">
      <path d="M10 5H7a2 2 0 0 0-2 2v3"/>
      <path d="M5 14v3a2 2 0 0 0 2 2h3"/>
      <path d="M14 19h3a2 2 0 0 0 2-2v-3"/>
    </g>
    <path d="M14 5h3a2 2 0 0 1 2 2v3" stroke="#8b8bf5" transform="translate(1.7 -1.7)"/>
  </g>
</svg>
